exclude: testing/Baseline/|bench.ipynb

repos:
- repo: https://github.com/pre-commit/mirrors-clang-format
  rev: ce4bd7270237e95464b37d808b942f02785192c4  # frozen: v23.1.5
  hooks:
  - id: clang-format
    types_or: ["c", "c++"]

- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
  hooks:
  - id: trailing-whitespace
  - id: end-of-file-fixer
  - id: check-yaml
  - id: check-added-large-files

- repo: https://github.com/crate-ci/typos
  rev: b859c0df7f391deba73030f79b957e62b4d81dc6  # frozen: varcon-core-v5.0.7
  hooks:
  - id: typos
    exclude: plugin/src/Plugin.cc

- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: 9026c9127e153371d7a78dfcb0c45ae2046a3d10  # frozen: v0.17.6
  hooks:
    - id: ruff-check
      args: ["--fix"]
    - id: ruff-format

- repo: https://github.com/doublify/pre-commit-rust
  rev: eeee35a89e69d5772bdee97db1a6a898467b686e  # frozen: v1.0
  hooks:
    - id: fmt
    - id: clippy
      args: ['--all', '--all-features', '--all-targets', '--workspace']
    - id: cargo-check
      args: ['--all', '--all-features', '--all-targets', '--workspace']
