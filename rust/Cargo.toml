[package]
name = "zeek-more-serializers"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["staticlib"]
test = false
doctest = false

[dependencies]
cxx = { version = "1.0.194", features = ["c++20"] }
postcard = { version = "1.1.3", features = ["use-std"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
thiserror = "2.0.18"
zeek-types = { path = "vendor/zeek-types", features = ["serde"] }

[features]
corrosion = ["zeek-types/corrosion"]

[lints]
workspace = true
